name: wasip3-component

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/wasip3-component.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/wasip3-component.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasip3-component:
    name: wasip3 component build and env.wit witness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: nightly
          targets: wasm32-wasip3

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          key: wasip3-component

      - name: Build the guest as a wasip3 component (slim, wit-env)
        run: cargo build -p rs-plugkit --target wasm32-wasip3 --features slim,wit-env

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-binstall

      - name: Install wasm-tools 1.262.0 from its release binary
        run: cargo binstall --no-confirm --disable-strategies compile wasm-tools@1.262.0

      - name: Parse env.wit
        run: wasm-tools component wit crates/plugkit-core/wit > /dev/null

      - name: Witness the component against env.wit
        run: |
          set -euo pipefail
          wasm=target/wasm32-wasip3/debug/rs_plugkit.wasm
          wasm-tools validate "$wasm"
          wasm-tools component wit "$wasm" > component.wit
          grep -q 'import gm:plugkit/env' component.wit
          grep -q 'export gm:plugkit/guest' component.wit
          awk '/^package gm:plugkit@/{on=1;next} /^package /{on=0} on' component.wit \
            | sed -n 's/^    \([a-z-]*\): func.*/\1/p' | sort -u > component-funcs.txt
          sed -n 's/^  \([a-z-]*\): func.*/\1/p' crates/plugkit-core/wit/env.wit | sort -u > env-funcs.txt
          test -s component-funcs.txt
          grep -qx 'dispatch-verb' component-funcs.txt
          grep -qx 'plugkit-version' component-funcs.txt
          unknown=$(comm -23 component-funcs.txt env-funcs.txt)
          if [ -n "$unknown" ]; then echo "::error::component declares functions absent from env.wit: $unknown"; exit 1; fi
          echo "component gm:plugkit functions: $(wc -l < component-funcs.txt) of $(wc -l < env-funcs.txt) declared in env.wit"
          echo "size_bytes=$(stat -c %s "$wasm")"
