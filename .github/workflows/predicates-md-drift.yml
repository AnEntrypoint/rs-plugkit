name: predicates-md-drift

on:
  push:
    branches: [main]
    paths:
      - "crates/plugkit-core/src/orchestrator/predicate_registry.rs"
  pull_request:
    paths:
      - "crates/plugkit-core/src/orchestrator/predicate_registry.rs"

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: rs-plugkit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AnEntrypoint/gm-config
          path: gm-config
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: generate predicates.md from the live registry
        run: |
          cat > gen_driver.rs <<'DRIVER'
          include!("rs-plugkit/crates/plugkit-core/src/orchestrator/predicate_registry.rs");
          fn main() {
              print!("{}", generated_predicates_md());
          }
          DRIVER
          rustc --edition 2021 gen_driver.rs -o /tmp/gen_driver
          /tmp/gen_driver > /tmp/generated-predicates.md
      - name: diff generated output against gm-config's committed copy
        run: |
          if ! diff -u gm-config/fsm/predicates.md /tmp/generated-predicates.md; then
            echo "::error::gm-config/fsm/predicates.md has drifted from rs-plugkit's predicate_registry.rs. Regenerate it (see the file's own header) and commit the result."
            exit 1
          fi
          echo "predicates.md matches the live registry (no drift)."
