name: Reusable wasm-plugin build and release

on:
  workflow_call:
    inputs:
      crate_dir:
        required: false
        type: string
        default: '.'
      wasm_artifact_name:
        required: true
        type: string
      published_asset_basename:
        required: true
        type: string
      release_repo:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      pre_build_steps:
        required: false
        type: string
        default: ''
      build_env:
        required: false
        type: string
        default: ''
      build_command:
        required: false
        type: string
        default: 'cargo build --release --target wasm32-wasip1'
    secrets:
      publisher_token:
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.crate_dir }}
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.publisher_token }}
          fetch-depth: 0

      - name: Auto-bump patch version BEFORE build
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
        run: |
          set -e
          git config user.name "gm-bot"
          git config user.email "noreply@github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" Cargo.toml
          git add Cargo.toml
          git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "::error::Rebase onto origin/main hit a real conflict; refusing to auto-resolve with -X theirs (would silently discard concurrent main changes)."
            git rebase --abort
            exit 1
          fi
          git push origin HEAD:main
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.crate_dir }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.crate_dir }} -> target

      - name: Pre-build steps
        if: inputs.pre_build_steps != ''
        shell: bash
        env:
          STEP_SCRIPT: ${{ inputs.pre_build_steps }}
        run: |
          printf '%s\n' "$STEP_SCRIPT" > /tmp/pre_build_steps.sh
          bash /tmp/pre_build_steps.sh

      - name: Build
        shell: bash
        env:
          BUILD_ENV_SCRIPT: ${{ inputs.build_env }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          printf '%s\n' "$BUILD_ENV_SCRIPT" > /tmp/build_env.sh
          set -a
          source /tmp/build_env.sh
          set +a
          printf '%s\n' "$BUILD_COMMAND" > /tmp/build_command.sh
          bash /tmp/build_command.sh

      - name: Stage release assets with checksum
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/wasm32-wasip1/release/${{ inputs.wasm_artifact_name }}" "release-assets/${{ inputs.published_asset_basename }}.wasm"
          cd release-assets
          sha256sum "${{ inputs.published_asset_basename }}.wasm" | sed 's/ \*/  /' > "${{ inputs.published_asset_basename }}.wasm.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          VER: ${{ needs.bump.outputs.version }}
          REPO: ${{ inputs.release_repo }}
          TITLE_PREFIX: ${{ inputs.release_title_prefix }}
          SHA: ${{ github.sha }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          if ! gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "$REPO" \
              --title "$TITLE_PREFIX v$VER" \
              --notes "Auto-published from CI at $SHA"
          fi
          gh release upload "v$VER" --repo "$REPO" --clobber release-assets/*

