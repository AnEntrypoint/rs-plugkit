name: wasm-plugin-release

on:
  workflow_call:
    inputs:
      wasm_artifact_name:
        required: true
        type: string
      published_asset_basename:
        required: true
        type: string
      release_repo:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      crate_dir:
        required: false
        type: string
        default: '.'
      version_manifest:
        required: false
        type: string
        default: 'Cargo.toml'
      pre_build_steps:
        required: false
        type: string
        default: ''
      build_env:
        required: false
        type: string
        default: ''
      build_command:
        required: true
        type: string
      release_signing_key_id:
        required: true
        type: string
      release_signing_public_key:
        required: true
        type: string
    secrets:
      publisher_token:
        required: true
      release_signing_key:
        required: true

jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected release signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.release_signing_key }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"

  bump:
    needs: signing-preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    defaults:
      run:
        working-directory: ${{ inputs.crate_dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          token: ${{ secrets.publisher_token }}
          fetch-depth: 0

      - name: Auto-bump patch version BEFORE build
        id: bump
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
        run: |
          set -e
          git config user.name "gm-bot"
          git config user.email "noreply@github.com"
          git config url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          MANIFEST="${{ inputs.version_manifest }}"
          CURRENT=$(grep '^version' "$MANIFEST" | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" "$MANIFEST"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [signing-preflight, bump]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.crate_dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - name: Pre-build steps
        if: inputs.pre_build_steps != ''
        shell: bash
        env:
          STEP_SCRIPT: ${{ inputs.pre_build_steps }}
        run: |
          printf '%s\n' "$STEP_SCRIPT" > /tmp/pre_build_steps.sh
          bash /tmp/pre_build_steps.sh

      - name: Build
        shell: bash
        env:
          BUILD_ENV_SCRIPT: ${{ inputs.build_env }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          printf '%s\n' "$BUILD_ENV_SCRIPT" > /tmp/build_env.sh
          set -a
          source /tmp/build_env.sh
          set +a
          printf '%s\n' "$BUILD_COMMAND" > /tmp/build_command.sh
          bash /tmp/build_command.sh

      - name: Stage release assets with checksum
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/wasm32-wasip1/release/${{ inputs.wasm_artifact_name }}" "release-assets/${{ inputs.published_asset_basename }}.wasm"
          cd release-assets
          sha256sum "${{ inputs.published_asset_basename }}.wasm" | sed 's/ \*/  /' > "${{ inputs.published_asset_basename }}.wasm.sha256"

      - name: Sign release assets
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.release_signing_key }}
          RELEASE_SIGNING_KEY_ID: ${{ inputs.release_signing_key_id }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ inputs.release_signing_public_key }}
          RELEASE_VERSION: ${{ needs.bump.outputs.version }}
          RELEASE_SEQUENCE: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd release-assets
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const artifact = `${{ inputs.published_asset_basename }}.wasm`;
          const seed = process.env.RELEASE_SIGNING_KEY;
          const publicKey = process.env.RELEASE_SIGNING_PUBLIC_KEY;
          const version = process.env.RELEASE_VERSION;
          const sequence = process.env.RELEASE_SEQUENCE;
          const keyId = process.env.RELEASE_SIGNING_KEY_ID;
          if (!/^[0-9a-f]{64}$/i.test(seed) || !/^[0-9a-f]{64}$/i.test(publicKey) || !/^\d+$/.test(sequence) || !keyId || !version) process.exit(1);
          const privateDer = Buffer.concat([Buffer.from('302e020100300506032b657004220420', 'hex'), Buffer.from(seed, 'hex')]);
          const privateKey = crypto.createPrivateKey({ key: privateDer, format: 'der', type: 'pkcs8' });
          const derived = crypto.createPublicKey(privateKey).export({ type: 'spki', format: 'der' }).subarray(-32).toString('hex');
          if (derived !== publicKey.toLowerCase()) process.exit(1);
          const sha256 = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          const nl = String.fromCharCode(10);
          const statement = ['agentplug-update-v1', `artifact:${artifact}`, `version:${version}`, `sequence:${sequence}`, `sha256:${sha256}`, ''].join(nl);
          const sig = crypto.sign(null, Buffer.from(statement), privateKey).toString('hex');
          const publicDer = Buffer.concat([Buffer.from('302a300506032b6570032100', 'hex'), Buffer.from(publicKey, 'hex')]);
          const verifier = crypto.createPublicKey({ key: publicDer, format: 'der', type: 'spki' });
          if (!crypto.verify(null, Buffer.from(statement), verifier, Buffer.from(sig, 'hex'))) process.exit(1);
          fs.writeFileSync(`${artifact}.sig`, `${JSON.stringify({ v: 1, artifact, version, sequence: Number(sequence), sha256, signatures: [{ key_id: keyId, sig }] })}\n`);
          NODE

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          VER: ${{ needs.bump.outputs.version }}
          REPO: ${{ inputs.release_repo }}
          TITLE_PREFIX: ${{ inputs.release_title_prefix }}
          SHA: ${{ github.sha }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          if ! gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "$REPO" \
              --title "$TITLE_PREFIX v$VER" \
              --notes "Auto-published from CI at $SHA"
          fi
          gh release upload "v$VER" --repo "$REPO" --clobber release-assets/*

      - name: Verify every uploaded asset is actually fetchable, not just reported as uploaded
        env:
          VER: ${{ needs.bump.outputs.version }}
          REPO: ${{ inputs.release_repo }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          base="https://github.com/$REPO/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name")
            if [ "$code" != "200" ]; then
              echo "::error::published release v$VER's $name is not fetchable (HTTP $code) -- the upload did not actually land"
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"
