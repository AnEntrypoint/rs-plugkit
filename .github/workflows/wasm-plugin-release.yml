name: wasm-plugin-release

on:
  workflow_call:
    inputs:
      wasm_artifact_name:
        required: true
        type: string
      published_asset_basename:
        required: true
        type: string
      release_repo:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      crate_dir:
        required: false
        type: string
        default: '.'
      source_repository:
        required: false
        type: string
        default: ''
      version_manifest:
        required: false
        type: string
        default: 'Cargo.toml'
      dependency_repos:
        required: false
        type: string
        default: ''
      pre_build_steps:
        required: false
        type: string
        default: ''
      build_env:
        required: false
        type: string
        default: ''
      build_command:
        required: true
        type: string
    secrets:
      publisher_token:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      deps: ${{ steps.check.outputs.deps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          fetch-depth: 1
          ref: main

      - name: Skip when neither this source nor its dependencies moved since the last release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          DEPENDENCY_REPOS: ${{ inputs.dependency_repos }}
          RELEASE_REPO: ${{ inputs.release_repo }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          deps=""
          for repo in $DEPENDENCY_REPOS; do
            sha=$(git ls-remote "https://github.com/$repo.git" refs/heads/main | cut -f1)
            deps="$deps$repo@$sha "
          done
          deps=${deps% }
          api_err=$(mktemp)
          if ! body=$(gh api "repos/$RELEASE_REPO/releases/latest" --jq '.body' 2>"$api_err"); then
            if grep -q 'HTTP 404' "$api_err"; then
              body=""
            else
              cat "$api_err" >&2
              exit 1
            fi
          fi
          recorded_head=$(printf '%s\n' "$body" | sed -n 's/^source-head: //p')
          recorded_deps=$(printf '%s\n' "$body" | sed -n 's/^source-deps: //p')
          skip=false
          if [ -n "$recorded_head" ] && [ "$head" = "$recorded_head" ] && [ "$deps" = "$recorded_deps" ]; then
            skip=true
            echo "sources and dependencies unchanged since ${recorded_head:0:9}; no release"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.crate_dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          token: ${{ secrets.publisher_token }}
          ref: main

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          key: wasm-plugin-${{ inputs.published_asset_basename }}

      - name: Pre-build steps
        if: inputs.pre_build_steps != ''
        shell: bash
        env:
          STEP_SCRIPT: ${{ inputs.pre_build_steps }}
        run: |
          printf '%s\n' "$STEP_SCRIPT" > /tmp/pre_build_steps.sh
          bash /tmp/pre_build_steps.sh

      - name: Compute the patch bump and write it into the manifest before build
        id: bump
        shell: bash
        run: |
          set -e
          MANIFEST="${{ inputs.version_manifest }}"
          CURRENT=$(grep '^version' "$MANIFEST" | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" "$MANIFEST"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          BUILD_ENV_SCRIPT: ${{ inputs.build_env }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          printf '%s\n' "$BUILD_ENV_SCRIPT" > /tmp/build_env.sh
          set -a
          source /tmp/build_env.sh
          set +a
          printf '%s\n' "$BUILD_COMMAND" > /tmp/build_command.sh
          bash /tmp/build_command.sh

      - name: Commit and push the version bump after the build succeeds
        id: push
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          MANIFEST: ${{ inputs.version_manifest }}
          VER: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -e
          git config user.name "lanmower"
          git config user.email "lanmower@users.noreply.github.com"
          ver="$VER"
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "[retry] attempt $attempt: main moved, re-bumping on origin/main"
              git fetch origin main
              git reset --hard origin/main
              current=$(grep '^version' "$MANIFEST" | head -1 | sed 's/.*= *"//;s/"//')
              IFS='.' read -r MAJOR MINOR PATCH <<< "$current"
              ver="$MAJOR.$MINOR.$((PATCH + 1))"
              sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$ver\"/}" "$MANIFEST"
            fi
            git add "$MANIFEST"
            git commit -m "chore: auto-bump version to $ver"
            if git push origin HEAD:main; then
              echo "version=$ver" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::version bump push rejected after 5 attempts; main kept moving"
          exit 1

      - name: Stage release assets with checksum
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/wasm32-wasip1/release/${{ inputs.wasm_artifact_name }}" "release-assets/${{ inputs.published_asset_basename }}.wasm"
          cd release-assets
          sha256sum "${{ inputs.published_asset_basename }}.wasm" | sed 's/ \*/  /' > "${{ inputs.published_asset_basename }}.wasm.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          VER: ${{ steps.push.outputs.version }}
          REPO: ${{ inputs.release_repo }}
          TITLE_PREFIX: ${{ inputs.release_title_prefix }}
          SOURCE_HEAD: ${{ steps.push.outputs.commit }}
          SOURCE_DEPS: ${{ needs.plan.outputs.deps }}
          SHA: ${{ github.sha }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          NOTES=$(printf 'source-head: %s\nsource-deps: %s\nAuto-published from CI at %s' "$SOURCE_HEAD" "$SOURCE_DEPS" "$SHA")
          if ! gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "$REPO" \
              --title "$TITLE_PREFIX v$VER" \
              --notes "$NOTES"
          else
            gh release edit "v$VER" --repo "$REPO" --notes "$NOTES"
          fi
          gh release upload "v$VER" --repo "$REPO" --clobber release-assets/*

      - name: Verify every uploaded asset is actually fetchable, not just reported as uploaded
        env:
          VER: ${{ steps.push.outputs.version }}
          REPO: ${{ inputs.release_repo }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          base="https://github.com/$REPO/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            for attempt in 1 2 3 4 5; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name")
              [ "$code" = "200" ] && break
              echo "[retry] $name HTTP $code (attempt $attempt)"
              sleep $((attempt * 5))
            done
            if [ "$code" != "200" ]; then
              echo "::error::published release v$VER's $name is not fetchable (HTTP $code) -- the upload did not actually land"
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"

      - name: Ask gm to advance its submodule pins
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            gh api repos/AnEntrypoint/gm/dispatches -f event_type=submodule-released && exit 0
            sleep $((attempt * 10))
          done
          gh workflow run bump-pins.yml --repo AnEntrypoint/gm --ref main && exit 0
          echo "::error::gm dispatch and bump-pins fallback both failed"
          exit 1
