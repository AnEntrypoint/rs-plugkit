name: wasm-plugin-release

on:
  workflow_call:
    inputs:
      wasm_artifact_name:
        required: true
        type: string
      published_asset_basename:
        required: true
        type: string
      release_repo:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      crate_dir:
        required: false
        type: string
        default: '.'
      source_repository:
        required: false
        type: string
        default: ''
      version_manifest:
        required: false
        type: string
        default: 'Cargo.toml'
      dependency_repos:
        required: false
        type: string
        default: ''
      pre_build_steps:
        required: false
        type: string
        default: ''
      build_env:
        required: false
        type: string
        default: ''
      build_command:
        required: true
        type: string
    secrets:
      publisher_token:
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      deps: ${{ steps.check.outputs.deps }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          fetch-depth: 50
          ref: main

      - name: Skip when neither this source nor its dependencies moved since the last release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          DEPENDENCY_REPOS: ${{ inputs.dependency_repos }}
          RELEASE_REPO: ${{ inputs.release_repo }}
          MANIFEST: ${{ inputs.version_manifest }}
        run: |
          set -euo pipefail
          # Source rule, fail closed. The source of HEAD is HEAD itself, or, when HEAD is a pure version-bump commit
          # (subject "chore: auto-bump version to ", a one-line change to $MANIFEST), its parent, recursively.
          # Skip only when that source equals source-head in the latest release body and the dependency pins match.
          # The release job records the source it built, never the bump commit it pushes after building, so a
          # recorded value is never a bump commit. An unresolvable source fails the job; nothing is skipped on a guess.
          source_of() {
            local sha=$1 steps=0 subject parent
            while :; do
              steps=$((steps + 1))
              [ "$steps" -le 50 ] || { echo "::error::no source commit within 50 commits of $1"; return 1; }
              subject=$(git log -1 --format=%s "$sha") || return 1
              case "$subject" in
                "chore: auto-bump version to "*) ;;
                *) SRC=$sha; return 0 ;;
              esac
              parent=$(git rev-parse --verify -q "$sha^") || { echo "::error::version bump $sha has no parent in the fetched history"; return 1; }
              [ "$(git diff --numstat "$parent" "$sha")" = "$(printf '1\t1\t%s' "$MANIFEST")" ] || { echo "::error::$sha is titled as a version bump but is not a one-line change to $MANIFEST"; return 1; }
              sha=$parent
            done
          }
          source_of "$(git rev-parse HEAD)" || { echo "::error::cannot resolve the source commit of HEAD"; exit 1; }
          src=$SRC
          deps=""
          for repo in $DEPENDENCY_REPOS; do
            sha=$(git ls-remote "https://github.com/$repo.git" refs/heads/main | cut -f1)
            deps="$deps$repo@$sha "
          done
          deps=${deps% }
          api_err=$(mktemp)
          if ! body=$(gh api "repos/$RELEASE_REPO/releases/latest" --jq '.body' 2>"$api_err"); then
            if grep -q 'HTTP 404' "$api_err"; then
              body=""
            else
              cat "$api_err" >&2
              exit 1
            fi
          fi
          recorded_head=$(printf '%s\n' "$body" | sed -n 's/^source-head: //p')
          recorded_deps=$(printf '%s\n' "$body" | sed -n 's/^source-deps: //p')
          skip=false
          if [ -n "$recorded_head" ] && [ "$src" = "$recorded_head" ] && [ "$deps" = "$recorded_deps" ]; then
            skip=true
            echo "source ${src:0:9} and dependencies unchanged since the last release; no release"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.crate_dir }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          token: ${{ secrets.publisher_token }}
          fetch-depth: 50
          ref: main

      - name: Resolve the source commit this build compiles (fail closed)
        id: built
        shell: bash
        env:
          MANIFEST: ${{ inputs.version_manifest }}
        run: |
          set -euo pipefail
          # Same source rule as the plan job: HEAD, or the parent of a pure version-bump commit, recursively.
          # The result is recorded as source-head; it is never the bump commit pushed after the build.
          source_of() {
            local sha=$1 steps=0 subject parent
            while :; do
              steps=$((steps + 1))
              [ "$steps" -le 50 ] || { echo "::error::no source commit within 50 commits of $1"; return 1; }
              subject=$(git log -1 --format=%s "$sha") || return 1
              case "$subject" in
                "chore: auto-bump version to "*) ;;
                *) SRC=$sha; return 0 ;;
              esac
              parent=$(git rev-parse --verify -q "$sha^") || { echo "::error::version bump $sha has no parent in the fetched history"; return 1; }
              [ "$(git diff --numstat "$parent" "$sha")" = "$(printf '1\t1\t%s' "$MANIFEST")" ] || { echo "::error::$sha is titled as a version bump but is not a one-line change to $MANIFEST"; return 1; }
              sha=$parent
            done
          }
          source_of "$(git rev-parse HEAD)" || { echo "::error::cannot resolve the source commit this build compiles"; exit 1; }
          echo "source=$SRC" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: nightly
          targets: wasm32-wasip3

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          key: wasm-plugin-${{ inputs.published_asset_basename }}

      - name: Pre-build steps
        if: inputs.pre_build_steps != ''
        shell: bash
        env:
          STEP_SCRIPT: ${{ inputs.pre_build_steps }}
        run: |
          printf '%s\n' "$STEP_SCRIPT" > "${{ runner.temp }}/pre_build_steps.sh"
          bash "${{ runner.temp }}/pre_build_steps.sh"

      - name: Compute the patch bump and write it into the manifest before build
        id: bump
        shell: bash
        run: |
          set -e
          MANIFEST="${{ inputs.version_manifest }}"
          CURRENT=$(grep '^version' "$MANIFEST" | head -1 | sed 's/.*= *"//;s/"//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW_VERSION\"/}" "$MANIFEST"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          BUILD_ENV_SCRIPT: ${{ inputs.build_env }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          # build.rs embeds this as health source_sha; the release records the same commit as source-head.
          PLUGKIT_BUILD_SHA: ${{ steps.built.outputs.source }}
        run: |
          printf '%s\n' "$BUILD_ENV_SCRIPT" > "${{ runner.temp }}/build_env.sh"
          set -a
          source "${{ runner.temp }}/build_env.sh"
          set +a
          printf '%s\n' "$BUILD_COMMAND" > "${{ runner.temp }}/build_command.sh"
          bash "${{ runner.temp }}/build_command.sh"

      - name: Commit and push the version bump after the build succeeds
        id: push
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          MANIFEST: ${{ inputs.version_manifest }}
          VER: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -e
          git config user.name "lanmower"
          git config user.email "almagestfraternite@gmail.com"
          git add "$MANIFEST"
          git commit -m "chore: auto-bump version to $VER"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "version=$VER" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt 3 ] || break
            echo "::warning::push of v$VER rejected, main moved; rebasing the bump onto origin/main (attempt $attempt of 3)"
            git fetch origin main
            git reset --hard HEAD
            git rebase origin/main
            actual=$(grep '^version' "$MANIFEST" | head -1 | sed 's/.*= *"//;s/"//')
            if [ "$actual" != "$VER" ]; then
              echo "::error::origin/main carries version $actual after rebase; v$VER was built for a different manifest"
              exit 1
            fi
          done
          echo "::error::push of v$VER failed after 3 attempts; main kept moving"
          exit 1

      - name: Stage release assets with checksum
        shell: bash
        run: |
          mkdir -p release-assets
          cp "target/wasm32-wasip3/release/${{ inputs.wasm_artifact_name }}" "release-assets/${{ inputs.published_asset_basename }}.wasm"
          cd release-assets
          sha256sum "${{ inputs.published_asset_basename }}.wasm" | sed 's/ \*/  /' > "${{ inputs.published_asset_basename }}.wasm.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          VER: ${{ steps.push.outputs.version }}
          REPO: ${{ inputs.release_repo }}
          TITLE_PREFIX: ${{ inputs.release_title_prefix }}
          SOURCE_HEAD: ${{ steps.built.outputs.source }}
          SOURCE_DEPS: ${{ needs.plan.outputs.deps }}
          SHA: ${{ github.sha }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          NOTES=$(printf 'source-head: %s\nsource-deps: %s\nAuto-published from CI at %s' "$SOURCE_HEAD" "$SOURCE_DEPS" "$SHA")
          if ! gh release view "v$VER" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "v$VER" \
              --repo "$REPO" \
              --title "$TITLE_PREFIX v$VER" \
              --notes "$NOTES"
          else
            gh release edit "v$VER" --repo "$REPO" --notes "$NOTES"
          fi
          gh release upload "v$VER" --repo "$REPO" --clobber release-assets/*

      - name: Verify every uploaded asset is actually fetchable, not just reported as uploaded
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
          VER: ${{ steps.push.outputs.version }}
          REPO: ${{ inputs.release_repo }}
        working-directory: ${{ inputs.crate_dir }}
        shell: bash
        run: |
          set -e
          base="https://github.com/$REPO/releases/download/v$VER"
          for f in release-assets/*; do
            name=$(basename "$f")
            delay=5
            code=000
            for attempt in $(seq 1 10); do
              code=$(curl -sL -o /dev/null -w '%{http_code}' "$base/$name") || code=000
              [ "$code" = "200" ] && break
              echo "[retry] $name HTTP $code (attempt $attempt of 10; download routes can lag a fresh upload, next check in ${delay}s)"
              [ "$attempt" -lt 10 ] && sleep "$delay"
              delay=$((delay * 2)); [ "$delay" -gt 60 ] && delay=60
            done
            if [ "$code" != "200" ]; then
              state=$(gh api "repos/$REPO/releases/tags/v$VER" --jq ".assets[] | select(.name == \"$name\") | .state" 2>/dev/null || true)
              echo "::error::published release v$VER's $name is not fetchable at $base after 10 attempts (last HTTP $code; API asset state: ${state:-missing})"
              exit 1
            fi
          done
          echo "[ok] all $(ls release-assets | wc -l) release assets confirmed fetchable at $base"

      - name: Ask gm to advance its submodule pins
        env:
          GH_TOKEN: ${{ secrets.publisher_token }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            gh api repos/AnEntrypoint/gm/dispatches -f event_type=submodule-released && exit 0
            sleep $((attempt * 10))
          done
          gh workflow run bump-pins.yml --repo AnEntrypoint/gm --ref main && exit 0
          echo "::error::gm dispatch and bump-pins fallback both failed"
          exit 1
