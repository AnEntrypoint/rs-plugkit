name: release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  workflow_dispatch:

concurrency:
  group: rs-plugkit-release
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/wasm-plugin-release.yml
    with:
      wasm_artifact_name: rs_plugkit.wasm
      published_asset_basename: plugkit-slim
      release_repo: AnEntrypoint/plugkit-bin
      release_title_prefix: plugkit
      version_manifest: crates/plugkit-core/Cargo.toml
      dependency_repos: AnEntrypoint/rs-search
      build_command: cargo build -p rs-plugkit --release --target wasm32-wasip1 --features slim
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
