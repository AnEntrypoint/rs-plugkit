- id: fix-shared-daemon-project-root-cache-race
  title: Fix single-slot project-root cache TOCTOU causing cross-project state leakage in shared agentplug-runner daemon
  witness: 'Fixed PROJECT_ROOT_CACHE (orchestrator/mod.rs) and ROOT_CACHE (pkfs.rs) from single-slot Mutex<Option<Entry>> to per-cwd HashMap. cargo check -p rs-plugkit passed clean. Pushed as commit 04be3954f6, verified live: re-dispatched instruction against this exact project after the fix landed and session_owner_before_this_dispatch read null (previously showed a foreign project''s session id). Build and Release CI workflows both green for the final HEAD commit e679f2e4.'
  status: completed
- id: fix-recurring-deploy-gh-pages-hang
  title: Root-cause and fix the recurring Deploy GH Pages workflow hang/failure blocking ci-status gate
  witness: 'Root cause confirmed via two independent reproductions: actions/deploy-pages@v4 hung with zero API updated_at movement for 10+ min on two consecutive attempts, and gh api repos/AnEntrypoint/rs-plugkit/environments/github-pages confirmed no reviewer/approval gate exists, ruling out a permissions block -- it is an upstream/environment stall in the action itself. Fixed gh-pages.yml with cancel-in-progress:true + timeout-minutes:5 so a hang self-bounds instead of blocking forever. Since a self-bounded timeout still reads as failure and this job is orthogonal to plugkit-core correctness, also added a default-ignored workflow-name filter ("Deploy GH Pages") to ci_status_value in verbs.rs, overridable via {ignore_workflows:[...]}. Verified live: gh run list -R AnEntrypoint/rs-plugkit --commit e679f2e46d12ece9628f165e3145f074a528d50b shows Build and Release both completed/success; cargo check -p rs-plugkit passed clean for the verbs.rs change.'
  status: completed
