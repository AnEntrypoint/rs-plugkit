- id: code-chunks-delete-before-insert-blocks-safe-budget-capping
  subject: 'index_cfg_impl deletes a changed file''s code_chunks rows (DELETE FROM {table} WHERE path=?1, three call sites ~1403/1419/1424) before tree-sitter re-extraction and the budget_chunks=.max(1) cap (~1473) run. This makes .max(1) load-bearing for correctness, not just progress: it is the only thing keeping cap above 0 for a file whose old rows are already gone, so a zero cap would leave the manifest and code_chunks genuinely empty for that file rather than merely stale. code_chunks has no per-chunk unique key (only path/kind/name/line_start/line_end/body/embedding columns, id is a bare autoincrement PK), so a partial replace cannot UPSERT by key today. The concrete reach action: capture this path''s existing rowids via SELECT rowid FROM {table} WHERE path=?1 before extraction, insert the new chunk set first, then DELETE FROM {table} WHERE rowid IN (<captured rowids>) -- insert-then-delete-by-captured-id instead of delete-then-insert, at all three call sites. This makes cap safely reach 0 (a file simply keeps its prior rows and gets retried, never goes empty) and unblocks removing .max(1)''s forced one-embed-per-file floor. Executing this now requires touching three call sites plus rowid-capture plumbing and live-verifying across add/modify-more-chunks/modify-fewer-chunks/delete scenarios with a real corpus -- scoping this row to exactly that reach action rather than the broader latency symptom.'
  session_id: codesearch-perf-20260917
  status: pending
- id: code-index-walk-phase-has-no-wall-budget
  title: code_index walk phase unbounded, one pass took 1717 s
  body: 'daemon.log shows a code_index partial pass for the spoint repo with pass_ms walk=1717211 collect_files=16367 manifests=15150 total=1762786 while the embed budget capped chunks at 0 (remaining_ms=0): the chunk cap bounds embedding but the file walk and manifest phases have no wall budget, so a cold walk held the store lane and a heavy slot for 29 minutes, and every store-lane verb (recall, memorize-fire, dual codesearch) of that project queued behind it. Apply a wall budget to walk/collect/manifests that stores a resume cursor and returns partial like the embed phase does, and log which directory subtree consumed the time.'
  acceptance_criteria: A cold index of the spoint repo returns within its budget with a resume cursor, successive passes converge, and no single pass exceeds the budget by more than one directory.
  session_id: hol-fix-1
  status: pending
- id: code-index-staleness-check-hashes-whole-corpus-per-dispatch
  title: Index staleness check re-reads and hashes every source file on every codesearch dispatch
  body: 'index_diff_at (crates/plugkit-core/src/code_index.rs) decides whether to rebuild by calling current_content_manifest_at, which enumerates the corpus with collect_files(root, cfg.index.digest_max_files) and then host_read + fnv1a64 over the FULL content of every language file -- 865 files in spoint -- on every codesearch dispatch that is not already auto_indexed. ensure_current_insight pays the same cost again. The result is correct, but the per-dispatch cost scales with corpus size rather than with the number of files that actually changed. A stat-first fast path would host_stat each file, compare (mtime_ms, size) against a stored pair, and only read+hash the minority whose stat differs, falling back to the full hash when mtime is unavailable (host_stat returning no mtime_ms). The risk to bound: mtime granularity and clock skew can miss a same-size edit inside the same mtime tick, so the fast path needs a measured false-negative rate before it replaces the full hash.'
  acceptance_criteria: On the live spool, a codesearch dispatch over an 800+ file corpus reports the number of content reads the staleness check performed, and that number is bounded by the stat-mismatched subset (single digits on an idle tree) instead of the full file count; a witness run that edits one file shows the same changed-file set as the current full-hash path, and a measured false-negative rate for the mtime fast path is recorded.
  status: pending
- id: memory-md-partial-digest-suffix-never-matches
  title: memory_md stores a ':partial=' suffixed digest that its own comparison can never match
  body: crates/plugkit-core/src/memory_md.rs:851 stores `format!("{digest}:partial={deferred}")` into the namespace meta digest, and line 604 gates work on `meta_digest(ns).as_deref() == Some(digest.as_str())` against the unsuffixed `digest`. A pass that ends partial therefore poisons the stored value so that every later comparison misses, exactly the mechanism that made the code-index rebuild loop permanent (fixed for code_index in this session by moving staleness to a per-file manifest at .gm/exec-spool/.codeinsight-content-manifest.json). The same shape here forces a resync on every call once any pass defers anything. Found while reading for the code-index row; not executed because it is a different namespace surface with its own sync/prune semantics and needs its own witness.
  acceptance_criteria: A witness over a namespace that has taken one partial pass shows the stored meta digest equal to a clean digest (no ':partial=' suffix), the line 604 comparison returning true on an unchanged corpus, and partial-ness carried out-of-band (as memory_md_sync_partial already does) rather than inside the compared value.
  status: pending
- id: treesitter-ok-true-unresolved-lang-yields-zero-chunks
  title: treesitter parse returns ok:true with empty nodes for an unresolved lang, silently indexing zero chunks
  body: 'agentplug-treesitter parse.rs:264 returns {"ok": true, "lang": null, "nodes": []} when resolve_lang fails, and abi.rs:65 advertises unresolved_lang_is_ok_true_with_empty_payload: true. plugin_ok() in verbs.rs:11 only checks ok==true, so every caller treats an unresolved language as a successful parse of nothing. dataflow_exec.rs:118 passes an arbitrary caller-supplied lang straight through with no validation, so lang "md"/"jsx"/""/"ts" yields zero chunks with no error field in the response. The main index path is one extension-table edit away from the same hole: adding ".vue" => "vue" to code_index.rs''s lang_for_ext table without adding "vue" to parse.rs''s lang_by_explicit_variant_name would make every .vue file index to zero chunks while the pass reports ok:true. The index pass in this session guards the file-level symptom (a manifest with zero chunks for a non-empty file is no longer reused), but the plugin contract itself still reports success for a non-parse.'
  acceptance_criteria: A live witness calls the treesitter plugin with a lang it does not resolve and the response carries ok:false (or a non-null lang plus a parse_error field) instead of ok:true with nodes:[]; plugkit's parse_nodes treats an unresolved lang as a failure and emits code_index_treesitter_failed with the path; and dataflow_exec rejects a lang the plugin's capabilities verb does not advertise.
  status: pending
- id: code-index-fallback-chunker-drops-tail-past-960-lines
  title: fallback_chunks silently drops every line past 960 while reporting le as if the window covered them
  body: code_index.rs fallback_chunks caps windows at FALLBACK_CHUNK_MAX_PER_FILE = 6 windows of FALLBACK_CHUNK_LINES = 160 lines, so a source file longer than 960 lines is indexed only to line 960. The last emitted chunk carries le = 960, which reads as a real end line, so nothing in the chunk rows, the manifest or the pass result marks the tail as unindexed. This only bites when the treesitter plugin is unavailable (the branch introduced alongside the code-index rebuild fix), but then it silently under-indexes large files -- exactly the files a search is most likely to need. A witness over a 2000-line file with treesitter forced unavailable should show either full coverage or an explicit marker that coverage stopped short.
  acceptance_criteria: With the treesitter plugin unavailable, a witness indexes a >960-line file and shows either every line covered by chunks or a chunk whose kind or payload records that coverage was truncated; no chunk reports an le that implies coverage it does not have, and the pass result names the number of files whose fallback coverage was truncated.
  status: pending
- id: code-index-topup-pass-embeds-one-file-per-pass
  title: Incremental top-up wall budget is below the pessimistic per-chunk cost, so every top-up pass embeds exactly one file
  body: 'code_index.rs index_cfg_impl gates fresh embedding on `under_floor = remaining_ms < pessimistic_ms_per_chunk`, allowing `floor_grace_used_this_pass` to admit one file past that gate and deferring every file after it. With defaults `incremental_topup_wall_budget_ms = 4000` and `pessimistic_ms_per_chunk_used_only_to_derive_a_budget_bound = 16000` (ragconfig.rs), remaining_ms starts below 16000, so under_floor is true from the very first file: exactly one file is embedded per top-up pass and every other file is deferred. On-disk proof from the live spool while the rebuild loop was running: .codeinsight-digest contains `v3:627597c3b13d75c7:files=1:partial=868` -- one file indexed, 868 deferred -- while the emitted current digest was `v3:0f5183fbde87e1f2:files=868`. So each rebuild advances the index by one file, which is why the stored digest could never catch up to the corpus and why the loop had no exit. Separating the two may be enough on its own to make the loop converge; the content-manifest fix in this session stops the loop being re-triggered once caught up, but does not change how much work one pass does. The pessimistic constant is documented as a budget BOUND, not a measured cost, so the fix needs a measured per-chunk embed cost before lowering it or before deriving the floor from the actual budget.'
  acceptance_criteria: A witness records the measured embed cost per chunk on the live spool; with that number, a top-up pass over an 800+ file corpus advances by more than one file (bounded by the 4 s budget, not by the 16 s pessimistic constant), and .codeinsight-digest no longer shows files=1 with a large :partial= tail after a run of consecutive passes.
  status: pending
- id: code-index-inline-sync-and-topup-budget-cross-reference
  title: 'Cross-reference: the per-dispatch inline code-index cost is the whole-corpus staleness hash, and the top-up budget row must not be folded into it'
  body: 'Three rows touch the same latency symptom and must stay distinguishable rather than being merged into one. (1) code-index-topup-pass-embeds-one-file-per-pass is budget arithmetic: incremental_topup_wall_budget_ms=4000 sits below pessimistic_ms_per_chunk_used_only_to_derive_a_budget_bound=16000, so under_floor is true from the first file and exactly one file is embedded per top-up pass. It is about how much work one pass does. (2) gm-dispatch-latency-carries-per-dispatch-remote-config-resolution-and-inline-code-index-sync is about WHEN the work runs: any of it executing inline on a dispatch a caller is blocking on. (3) code-index-staleness-check-hashes-whole-corpus-per-dispatch is the mechanism behind (2)''s second cost: index_diff_at calls current_content_manifest_at, which enumerates with collect_files and then host_read + fnv1a64 over the FULL content of every language file (865 in spoint) on every dispatch, so the per-dispatch cost scales with corpus size rather than with what actually changed. (3) therefore explains (2); it is not a duplicate of it, and (1) is neither. Closure rule: if the stat-first fast path described in (3) lands, (3) and the inline-sync half of (2) resolve on the same single witness -- record that witness against both and do not let one be resolved by reference to the other while the other stays orphaned. Witness available now: an isolated AGENTPLUG_HOME harness runs two plugkit builds side by side on identical corpora (one home with the deployed gm.wasm, one with a locally built slim wasm), so a stat-first fast path can be measured against the full-hash path under identical conditions without swapping the binary the live spool depends on.'
  acceptance_criteria: A single witness run on an 800+ file corpus shows the staleness check reading and hashing only the stat-mismatched subset (single digits on an idle tree) instead of the full file count, the reported changed-file set is identical to the current full-hash path's, and a measured false-negative rate for the mtime fast path is recorded; that same witness text is cited in the resolution of both this row and gm-dispatch-latency-carries-per-dispatch-remote-config-resolution-and-inline-code-index-sync, and code-index-topup-pass-embeds-one-file-per-pass remains a separate pending row rather than being folded into either.
  status: pending
- id: codeinsight-embed-backlog-never-drains-when-embedding-unavailable
  title: The persisted embedding backlog retries on every dispatch when the embed backend is unreachable, adding bounded-but-perpetual work to each codesearch
  body: 'Landing the incremental content manifest separated content tracking from embedding progress: a file''s content hash is recorded as soon as its chunks are persisted, and files still awaiting embeddings are tracked in .gm/exec-spool/.codeinsight-embed-backlog.json. A codesearch with no content change but a non-empty backlog drains it with a bounded top-up and emits codeinsight_embed_backlog rather than codeinsight_rebuild. That is correct while embeddings can succeed. When the backend cannot (no network to the embed service, or a slim build whose weights are compiled out), every chunk stays pending, the backlog never drains, and every dispatch performs a top-up pass and emits the event: measured 13 codeinsight_embed_backlog events across a 10-minute, 17-dispatch window on a 40-file scratch corpus, against 0 on the same corpus with treesitter present and embeddings failing only intermittently. The work per dispatch is bounded by incremental_topup_wall_budget_ms so it does not hang a caller, but it is unbounded across dispatches and it is pure waste while the backend is down. It also masks the real state: a permanently unembeddable corpus looks identical to one that is merely catching up.'
  acceptance_criteria: Consecutive failed drain attempts are counted and persisted with a next-attempt timestamp, and the retry interval backs off; with the embed backend unreachable, a 10-minute window on the same harness shows at most 2 codeinsight_embed_backlog events and no top-up work on dispatches inside the backoff window, while a control window where the backend is reachable still drains a seeded backlog to empty within one pass and the event count returns to 0 once drained.
  status: pending
- id: code-index-treesitter-unknown-plugin-outage-cause-unnamed
  title: The transient treesitter unknown_plugin outage that produced 922 code_index_treesitter_failed events has a named event now but still no named cause
  body: 'The 922 code_index_treesitter_failed events in the spoint watcher log were all plugin_failure=unknown_plugin, and they stopped on their own: the last one is 7.7 h before the current log tail, while the treesitter plugin is installed and parsing normally. So the outage was transient, and the diagnosis at the time (a sibling plugin registration gap while another plugin was registering) is an inference from timing, not a witnessed cause. The landed work in rs-plugkit 6d2966e fixed the reporting, not the outage: availability is now resolved once per reprobe window, so a recurrence emits code_index_treesitter_unavailable once with plugin_failure, files_affected, first_path, langs and sample_paths plus reprobe_after_ms, instead of one pathless event per file. Witnessed on a scratch project with treesitter.wasm removed from the plugin home: 40 pathless code_index_treesitter_failed events before, 0 after, replaced by 3 code_index_treesitter_unavailable events carrying file paths. What is still missing is why host_plugin_call returns unknown_plugin at all during that window -- whether it is registration order, a per-plugin load race, a host-side plugin table that is not populated until first successful call, or the updater replacing the wasm file mid-flight. Until that is named, the outage can recur and will be reported clearly but not explained.'
  acceptance_criteria: A reproduction of unknown_plugin is captured with the host-side plugin registration state at the moment of failure (which plugins are registered, which wasm paths are present, whether the plugin table was mid-mutation), the call that returns unknown_plugin is identified in agentplug-host, and the fix removes the window or makes registration atomic; a run that previously produced the outage produces zero code_index_treesitter_unavailable events.
  status: pending
