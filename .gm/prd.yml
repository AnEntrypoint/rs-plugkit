- id: index-topup-per-file-embed-floor-overshoots-small-budgets
  subject: 'index_cfg_impl''s per-file budget_chunks = (remaining_ms/pessimistic_ms_per_chunk).max(1) forces at least one chunk-embed through even when remaining_ms is already ~0, so a small topup budget (e.g. incremental_topup_wall_budget_ms=4000) can overrun by one worst-case single-embed cost (measured 3.6-15.2s) per file that slips through near the deadline -- live-measured a 4000ms topup pass actually taking 10.4s-17.2s (2.6x-4.3x) on this repo, purely from 1-2 boundary files each embedding exactly one chunk. Safe fix: compute the budget-derived chunk cap BEFORE reading a file''s content/pushing its digest_entries contribution, and defer the whole file (same as the existing elapsed>wall_budget outer-loop defer) when that cap would be 0, rather than truncating to max(1) after content is already read and the digest entry already recorded -- ordering matters, since digest_entries.push() currently happens unconditionally before the cap is known, and skipping embed after that push would desync the stored digest from actual code_chunks/manifest state (the same class of bug code_index.rs:1559-1571''s comment already warns about for the separate no-elapsed-check chunk-WRITE-loop issue). Out of scope for a quick pass: verify via repeated live dispatch on a corpus with a deliberately stable digest (no concurrent editors) that topup passes stay within roughly 1.5x of incremental_topup_wall_budget_ms after the fix.'
  session_id: codesearch-perf-20260917
  status: completed
  witness: 'Root-caused fully: the .max(1) floor this row names is load-bearing for correctness, not just an over-generous progress guarantee -- index_cfg_impl deletes a changed file''s code_chunks rows before the cap is computed, so a cap of 0 would leave that file''s manifest and code_chunks genuinely empty rather than merely stale. Superseded by code-chunks-delete-before-insert-blocks-safe-budget-capping, which names the concrete prerequisite (insert-then-delete-by-captured-rowid instead of delete-then-insert) that has to land before .max(1) can be safely removed. Resolving this row into that one rather than tracking the same investigation twice.'
- id: code-chunks-delete-before-insert-blocks-safe-budget-capping
  subject: 'index_cfg_impl deletes a changed file''s code_chunks rows (DELETE FROM {table} WHERE path=?1, three call sites ~1403/1419/1424) before tree-sitter re-extraction and the budget_chunks=.max(1) cap (~1473) run. This makes .max(1) load-bearing for correctness, not just progress: it is the only thing keeping cap above 0 for a file whose old rows are already gone, so a zero cap would leave the manifest and code_chunks genuinely empty for that file rather than merely stale. code_chunks has no per-chunk unique key (only path/kind/name/line_start/line_end/body/embedding columns, id is a bare autoincrement PK), so a partial replace cannot UPSERT by key today. The concrete reach action: capture this path''s existing rowids via SELECT rowid FROM {table} WHERE path=?1 before extraction, insert the new chunk set first, then DELETE FROM {table} WHERE rowid IN (<captured rowids>) -- insert-then-delete-by-captured-id instead of delete-then-insert, at all three call sites. This makes cap safely reach 0 (a file simply keeps its prior rows and gets retried, never goes empty) and unblocks removing .max(1)''s forced one-embed-per-file floor. Executing this now requires touching three call sites plus rowid-capture plumbing and live-verifying across add/modify-more-chunks/modify-fewer-chunks/delete scenarios with a real corpus -- scoping this row to exactly that reach action rather than the broader latency symptom.'
