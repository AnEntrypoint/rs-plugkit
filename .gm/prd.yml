- id: codesearch-embedder-unavailable
  subject: 'Noticed: codesearch and recall are both dead in this environment because the bert plugin resolves to unknown_plugin, so semantic discovery degraded to nothing and exec_js had to carry discovery; record the gap rather than let it evaporate'
  witness: 'Recorded as a session-environment defect, not worked around silently. Every codesearch and recall dispatch this session returned error_code=failed, and .gm/exec-spool/.watcher.log carries the cause: evt embed_query_failed with plugin_failure=unknown_plugin and reason ''bert plugin call failed'', followed by rssearch_vector_hits_skipped and codesearch_degraded kv_hits=0. The bert wasm plugin is not registered with this agentplug daemon, so semantic retrieval has no embedder and the keyword fallback matched nothing. Discovery for this task was carried by exec_js, which the orchestrator prose explicitly leaves unrestricted for investigation. This is an agentplug plugin-registration gap outside rs-plugkit''s own source, surfaced here so it is not mistaken for an empty index.'
  status: completed
  commit_comment: Recorded the bert/unknown_plugin embedder outage that disabled codesearch and recall this session
